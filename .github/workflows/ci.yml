# Mac-first validation for main and every pull request. DMG packaging is a final-delivery step.
name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "tools/website/**"
      - "i18n/site/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "website/**"
      - "tools/website/**"
      - "i18n/site/**"
      - "docs/**"
      - "**/*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match the user's Intel x86_64 Mac target; macos-latest selects Apple Silicon.
          - os: macos-15-intel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Format
        if: runner.os == 'macOS'
        run: cargo fmt --all --check
      - name: English catalog matches the code
        if: runner.os == 'macOS'
        run: |
          python tools/i18n/extract.py
          git diff --exit-code -- i18n/en.tsv
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Safari extension's relay and helper, sandboxed
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p mdm-nmhost
          tools/safari/selftest.sh target/release/misterdownloadmanager-nmhost
      # DMG creation is intentionally deferred until the macOS product is complete.

  translations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reviewed translations kept
        run: python3 tools/i18n/reviewed_guard.py --base "origin/${{ github.base_ref }}"

  extension:
    name: browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Logic against fake Firefox and Chrome APIs
        run: node tools/extension/test.mjs
      - name: Pack for every browser
        shell: pwsh
        run: ./tools/extension/pack.ps1
      - name: Check the packages
        run: node tools/extension/check-pack.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            target/extension/mdm-chromium.zip
            target/extension/mdm-firefox.xpi
            target/extension/mdm-chrome-store.zip
