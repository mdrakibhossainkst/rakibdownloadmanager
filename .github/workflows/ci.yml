# Build, lint and test main and every pull request: Windows and Linux, which must pass, and the
# experimental macOS build (its failures are reported but don't fail the run).
name: CI

# Pushes to main only: a pull request's branch is tested once as the pull request (a bare push:
# ran everything twice), and a release tag's commit was already tested on main.
# A change to the website or the docs alone builds nothing here (the app embeds none of it; the
# Website workflow builds the site). The app's own catalogs, i18n/*.tsv, still run everything.
on:
  workflow_dispatch:
  push:
    branches: [main, rakib/phase-01-macos-audit]
    paths-ignore:
      - "website/**"
      - "tools/website/**"
      - "i18n/site/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    paths-ignore:
      - "website/**"
      - "tools/website/**"
      - "i18n/site/**"
      - "docs/**"
      - "**/*.md"

# A newer commit on a pull request makes its older run moot: cancel it (main runs to the end).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest
          - os: macos-latest
            experimental: true
          # Intel compile/test coverage for the user's x86_64 Mac. Keep macOS experimental
          # until GUI lifecycle behaviour is verified on a real Ventura installation.
          - os: macos-15-intel
            experimental: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    # A cold build takes about 10 minutes; a hung runner (apt-get once hung for hours) is cut off
    # instead of running to GitHub's 6 hours.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml picks stable with rustfmt and clippy.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Linux libraries
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libwayland-dev libgl1-mesa-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Format
        if: runner.os == 'Windows'
        run: cargo fmt --all --check

      # A text added to the code without running tools/i18n/extract.py fails here; missing
      # translations don't (they show in English until tools/i18n/translate.py runs).
      - name: English catalog matches the code
        if: runner.os == 'Windows'
        run: |
          python tools/i18n/extract.py
          git diff --exit-code -- i18n/en.tsv

      - name: Release signing identity matches the pinned public key
        if: runner.os == 'Linux'
        run: |
          fingerprint="$(gpg --show-keys --with-colons crates/tools/keys/rakib-release.asc | awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$fingerprint" = "FB1E9144C6FC782CC6CE61DFE6852D874F11BDFB"
          grep -Fq 'RAKIB_RELEASE_KEY:' .github/workflows/release.yml
          grep -Fq 'Set-Content -Encoding ascii $key $env:RAKIB_RELEASE_KEY' .github/workflows/release.yml
          grep -Fq -- '--local-user FB1E9144C6FC782CC6CE61DFE6852D874F11BDFB' .github/workflows/release.yml

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      # The app bundle's custom SVG icon must rasterize and pack on both Intel and Apple Silicon.
      - name: Rakib app icon renders and packs as ICNS
        if: runner.os == 'macOS'
        run: |
          tmp="$(mktemp -d)"
          swift tools/installer/render-svg-icon.swift "art/Rakib Download Manager.svg" "$tmp/RakibIcon.png"
          sips -g pixelWidth -g pixelHeight "$tmp/RakibIcon.png"
          mkdir "$tmp/AppIcon.iconset"
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size" "$tmp/RakibIcon.png" --out "$tmp/AppIcon.iconset/icon_${size}x${size}.png" >/dev/null
            double=$((size * 2))
            sips -z "$double" "$double" "$tmp/RakibIcon.png" --out "$tmp/AppIcon.iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$tmp/AppIcon.iconset" -o "$tmp/RakibAppIcon.icns"
          test -s "$tmp/RakibAppIcon.icns"
          rm -rf "$tmp"

      # Safari's extension (macOS): its native half relays to the helper from inside the
      # sandbox Safari makes it run in. Safari itself isn't needed.
      - name: Safari extension's relay and helper, sandboxed
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p mdm-nmhost
          tools/safari/selftest.sh target/release/misterdownloadmanager-nmhost

  # A translator's reviewed rows (no "#, machine" line) must survive every pull request: no
  # tool or merge may drop them or hand them back to machine translation.
  translations:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reviewed translations kept
        run: python3 tools/i18n/reviewed_guard.py --base "origin/${{ github.base_ref }}"

  extension:
    name: browser extension
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare Pillow for original extension icons
        run: python -m pip install Pillow

      - name: Logic against fake Firefox and Chrome APIs
        run: node tools/extension/test.mjs

      # Chrome, Edge, Brave, Opera, Vivaldi (mdm-chromium.zip), Firefox (mdm-firefox.xpi) and
      # the Chrome Web Store's copy (mdm-chrome-store.zip).
      - name: Pack for every browser
        shell: pwsh
        run: ./tools/extension/pack.ps1

      - name: Check the packages
        run: node tools/extension/check-pack.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: extension
          path: |
            target/extension/mdm-chromium.zip
            target/extension/mdm-firefox.xpi
            target/extension/mdm-chrome-store.zip
